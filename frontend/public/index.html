<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="runtime-config.js"></script>
  <title>Mart POS</title>
  <script>
    (function(){
      try {
        var user = localStorage.getItem("martUser");
        var lastActivity = parseInt(localStorage.getItem("martLastActivity") || "0", 10);
        var timeoutMs = 2 * 60 * 1000;
        if (user && JSON.parse(user)) {
          if (lastActivity && (Date.now() - lastActivity >= timeoutMs)) {
            localStorage.removeItem("martUser");
            localStorage.removeItem("martLastActivity");
            window.location.replace("login.html");
            return;
          }
          window.location.replace("Dashboard-page.html");
        } else {
          window.location.replace("login.html");
        }
      } catch(e) {
        localStorage.removeItem("martUser");
        localStorage.removeItem("martLastActivity");
        window.location.replace("login.html");
      }
    })();
  </script>
</head>
<body>
</body>
</html>
