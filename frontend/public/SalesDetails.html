<!DOCTYPE html>
<html lang="en">
<head>
  <script src="runtime-config.js"></script>
  <script>
    (function(){
      try {
        const u = localStorage.getItem("martUser");
        if(!u || !JSON.parse(u)) {
          window.location.replace("login.html");
        }
      } catch(e) {
        localStorage.removeItem("martUser");
        window.location.replace("login.html");
      }
    })();
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Details</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<link rel="stylesheet" href="css/pages/SalesDetails.css">
<link rel="stylesheet" href="css/shared-sidebar.css">
</head>

<body data-page="receipt-history">
<div class="sidebar" id="sidebar"></div>

<div class="navbar" id="navbar">
  <button class="nav-icon-btn" type="button" onclick="toggleSidebar()" aria-label="Toggle sidebar">
    <i class="fas fa-bars"></i>
  </button>
  <div class="nav-actions">
    <button class="nav-icon-btn" type="button" onclick="go('Dashboard-page.html')" aria-label="Go to dashboard">
      <i class="fas fa-home"></i>
    </button>
    <button class="nav-icon-btn" type="button" onclick="go('Profile.html')" aria-label="Profile">
      <i class="fas fa-user"></i>
    </button>
    <button class="nav-icon-btn" type="button" aria-label="Settings">
      <i class="fas fa-cog"></i>
    </button>
  </div>
</div>

<div class="main" id="main">

  <h2>Sales Details</h2>
  <br>
  <div class="topbar">
    <div class="search">
      <i class="fas fa-search"></i>
      <input id="search" placeholder="Search invoice / staff..." oninput="renderSales()">
    </div>
    <div class="topbar-actions">
      <div class="total-pill" id="totalPill">
        <i class="fas fa-chart-line"></i>
        <span>Total: <strong id="totalCount">0</strong> Sales</span>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Invoice</th>
        <th>Date</th>
        <th>Staff</th>
        <th>Status</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="salesTable">
      <tr>
        <td colspan="5">Loading...</td>
      </tr>
    </tbody>
  </table>

</div>

<script src="shared-sidebar.js"></script>
<script>
function toggleSidebar(){
  const sidebar=document.getElementById("sidebar");
  const navbar=document.getElementById("navbar");
  const main=document.getElementById("main");

  if(window.innerWidth<=768){
    sidebar.classList.toggle("open");
    return;
  }

  sidebar.classList.toggle("closed");
  navbar.classList.toggle("full");
  main.classList.toggle("full");
}

function go(page){
  (window.navigateToPage || function(p){ window.location.href = p; })(page);
}

function logout(){
  localStorage.removeItem("martUser");
  (window.navigateToPage || function(p){ window.location.href = p; })("login.html", "Logging out...");
}

// Authentication Guard
let CURRENT_USER = null;
try {
  CURRENT_USER = JSON.parse(localStorage.getItem("martUser") || "null");
} catch {
  CURRENT_USER = null;
}
if (!CURRENT_USER) {
  localStorage.removeItem("martUser");
  window.location.replace("login.html");
}

let SALES=[];

function formatDate(d){
  const date=new Date(d);
  return date.toLocaleDateString();
}

function statusBadge(status){
  const s=(status||"Completed").toLowerCase();

  if(s==="pending") return '<span class="status pending">Pending</span>';
  if(s==="cancelled") return '<span class="status cancelled">Cancelled</span>';

  return '<span class="status completed">Completed</span>';
}

async function loadSales(){
  try {
    const res=await fetch("/api/sales");
    const data=await res.json();
    SALES=data.sales || [];
    renderSales();
  } catch(err) {
    document.getElementById("salesTable").innerHTML = "<tr><td colspan='5'>Error loading sales</td></tr>";
  }
}

function renderSales(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const table=document.getElementById("salesTable");

  const filtered=SALES.filter(s=>
    String(s.invoiceNo || "").toLowerCase().includes(q) ||
    String(s.staffName || "").toLowerCase().includes(q)
  );

  const totalCountEl = document.getElementById("totalCount");
  if(totalCountEl){
    totalCountEl.textContent = q ? `${filtered.length} / ${SALES.length}` : `${SALES.length}`;
  }

  if(filtered.length===0){
    table.innerHTML="<tr><td colspan='5'>No sales found</td></tr>";
    return;
  }

  table.innerHTML=filtered.map(s=>`
    <tr>
      <td>${s.invoiceNo || ""}</td>
      <td>${formatDate(s.saleDate)}</td>
      <td>${s.staffName || ""}</td>
      <td>${statusBadge(s.status)}</td>
      <td>$${Number(s.totalAmount || 0).toFixed(2)}</td>
    </tr>
  `).join("");
}

loadSales();
</script>

</body>
</html>
